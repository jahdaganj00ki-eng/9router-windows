name: Build Electron Desktop App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v0.5.76)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate version format
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$INPUT_VERSION"
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format. Expected: v0.5.76"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✓ Valid version: $VERSION"

  web-build:
    name: Build Next.js standalone
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: 9router
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: jahdaganj00ki-eng/9router
          ref: ${{ needs.validate.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: 9router

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 9router/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: true

      - name: Build Next.js standalone
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          NODE_OPTIONS: "--max_old_space_size=6144"
          OMNIROUTE_USE_TURBOPACK: "0"
        run: npm run build

      - name: Pack standalone bundle
        run: |
          mkdir -p .build
          tar -czf web-bundle.tar.gz -C .next .
          echo "✓ Packed web bundle"
          ls -lh web-bundle.tar.gz

      - name: Upload shared web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-standalone-bundle
          compression-level: 0
          retention-days: 3
          path: |
            9router/web-bundle.tar.gz

  build-windows:
    name: Build Electron (Windows)
    needs: [validate, web-build]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.web-build.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sanitize Windows home directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "USERPROFILE=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - name: Download shared web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-standalone-bundle

      - name: Restore web bundle
        shell: bash
        run: |
          mkdir -p .next
          tar -xzf web-bundle.tar.gz -C .next
          echo "✓ Restored web bundle"
          ls -la .next/standalone | head -20

      - name: Sync version in electron/package.json
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          VERSION_NO_V="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('electron/package.json'));
            pkg.version = '$VERSION_NO_V';
            fs.writeFileSync('electron/package.json', JSON.stringify(pkg, null, 2) + '\\n');
          "
          echo "✓ electron/package.json version set to $VERSION_NO_V"

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci --no-audit --no-fund

      - name: Build Electron for Windows
        working-directory: electron
        env:
          NINEROUTER_SOURCE: ${{ github.workspace }}
        run: npm run build:win

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-assets
          cd electron/dist-electron
          for file in *.exe; do
            [ -f "$file" ] && cp "$file" ../../release-assets/
          done
          for file in latest*.yml; do
            [ -f "$file" ] && cp "$file" ../../release-assets/
          done
          echo "release-assets:"
          ls -la ../../release-assets/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-windows
          path: release-assets/

  release:
    name: Create Release
    needs: [validate, build-windows]
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.version }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect the remaining artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f ! -name latest-mac.yml -exec cp -n {} release-assets/ \;
          echo "release-assets:"
          ls -la release-assets/

      - name: List release files
        run: ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            release-assets/*.exe
            release-assets/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-desktop-assets:
    name: Verify desktop assets landed
    needs: [validate, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert Windows installer is present on the release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          names=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
                    --json assets --jq '.assets[].name')
          echo "Assets on $VERSION:"
          echo "$names" | sed 's/^/  /'

          if ! echo "$names" | grep -qE '\.exe$'; then
            echo "::error::Windows channel incomplete on $VERSION — no .exe asset found"
            exit 1
          fi
          echo "✓ Windows installer present on $VERSION"
